# /etc/nginx/sites-available/fileservice  (activar com um link em sites-enabled)
#
# Proxy HTTPS para o serviço de ficheiros. Ajustar server_name e os caminhos do certificado.
# Validar e aplicar:  sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name ficheiros.exemplo.co.ao;
    return 301 https://$host$request_uri;
}

server {
    # Em nginx >= 1.25.1 a forma recomendada é "listen 443 ssl;" mais "http2 on;".
    listen 443 ssl http2;
    server_name ficheiros.exemplo.co.ao;

    ssl_certificate     /etc/ssl/certs/ficheiros.exemplo.co.ao.crt;
    ssl_certificate_key /etc/ssl/private/ficheiros.exemplo.co.ao.key;

    # Igual ao tecto do serviço (spring.servlet.multipart.max-request-size).
    client_max_body_size 105m;

    # O health check e restantes endpoints de gestão não saem para a rede.
    location /actuator/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;

        # O serviço usa estes cabeçalhos para construir URLs públicos e validar a origem (CORS).
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # Uploads e downloads em streaming, sem cópia intermédia em disco no Nginx.
        proxy_request_buffering off;
        proxy_buffering off;

        proxy_connect_timeout 5s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }
}
