# Incluir dentro do bloco HTTPS existente de portal.pumangol.co.ao.
# O proxy_pass com "/" final remove o prefixo /ficheiros/ antes de encaminhar
# os pedidos para a aplicação Spring Boot em 127.0.0.1:18085.

location = /ficheiros {
    return 301 /ficheiros/;
}

# Não expor endpoints internos de monitorização através do site público.
location ^~ /ficheiros/actuator {
    return 404;
}

location ^~ /ficheiros/ {
    client_max_body_size 105m;

    proxy_pass http://127.0.0.1:18085/;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;

    proxy_request_buffering off;
    proxy_buffering off;

    proxy_connect_timeout 5s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;
}
